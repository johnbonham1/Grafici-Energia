services:
  - type: web
    runtime: static
    name: dashboard-aeif-preprod
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    autoDeployTrigger: commit
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
