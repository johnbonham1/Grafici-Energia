services:
  - type: web
    runtime: static
    name: dashboard-aeif-preprod
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    autoDeployTrigger: commit
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  - type: web
    runtime: python
    name: dashboard-aeif-api-preprod
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db_init
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-aeif-db-preprod
          property: connectionString
      - key: ENVIRONMENT
        value: preprod
      - key: CORS_ORIGINS
        value: https://dashboard-aeif-preprod.onrender.com
  - type: cron
    runtime: python
    name: dashboard-aeif-pun-scraper-preprod
    rootDir: backend
    schedule: "30 11 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.update_pun
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-aeif-db-preprod
          property: connectionString
      - key: ENVIRONMENT
        value: preprod
      - key: PUN_SOURCE_URL
        sync: false

databases:
  - name: dashboard-aeif-db-preprod
    databaseName: dashboard_aeif
    user: dashboard_aeif
    plan: free
