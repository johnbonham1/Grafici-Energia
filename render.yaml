services:
  - type: web
    runtime: python
    name: dashboard-aeif-api
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-aeif-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: https://dashboard-aeif.onrender.com

  - type: cron
    runtime: python
    name: dashboard-aeif-pun-scraper
    rootDir: backend
    schedule: "30 11 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.update_pun
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-aeif-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PUN_SOURCE_URL
        sync: false

databases:
  - name: dashboard-aeif-db
    databaseName: dashboard_aeif
    user: dashboard_aeif
    plan: free
