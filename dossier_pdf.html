<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier PDF · Dashboard AEIF</title>
<meta name="description" content="Lettore PDF dei dossier collegati alla Dashboard AEIF.">
<meta name="theme-color" content="#f6f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard AEIF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="assets/mase-logo.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#f6f8fb;--panel:#fff;--ink:#151d2a;--muted:#617186;--line:#dfe6ee;
    --line-strong:#cfd8e3;--blue:#3269c7;--navy:#16243d;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;min-height:100%;background:linear-gradient(180deg,#fff,#f6f8fb 48%,#eef3f8);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:22px}
  .wrap{height:calc(100vh - 44px);max-width:1220px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px}
  .bar{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:14px;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    box-shadow:0 12px 34px -26px rgba(20,30,45,.42);
  }
  .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:38px;
    padding:9px 12px;
    border:1px solid var(--line-strong);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    text-decoration:none;
    font:750 13px/1 var(--sans);
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
  }
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .title{min-width:0;text-align:center}
  .title img{width:74px;height:auto;display:block;margin:0 auto 6px}
  .title h1{font-size:20px;line-height:1.2;font-weight:800;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title p{margin-top:5px;color:var(--muted);font:700 10px/1.4 var(--mono);letter-spacing:.10em;text-transform:uppercase}
  .viewer{
    min-height:0;
    overflow:hidden;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 12px 34px -26px rgba(20,30,45,.42);
  }
  iframe{width:100%;height:100%;border:0;background:#fff}
  .fallback{display:none;padding:22px;color:var(--muted);line-height:1.6}
  @media(max-width:720px){
    body{padding:12px}
    .wrap{height:calc(100vh - 24px);gap:10px}
    .bar{grid-template-columns:1fr;gap:10px;padding:12px}
    .nav{justify-content:space-between}
    .nav .btn{flex:1}
    .title{order:-1}
    .title img{width:66px}
    .title h1{font-size:17px;white-space:normal}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{font-size:12px;padding:8px 10px}
    .viewer{border-radius:10px}
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="bar">
    <nav class="nav" aria-label="Navigazione dossier">
      <button class="btn" type="button" id="backBtn">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Indietro
      </button>
      <a class="btn" href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
    </nav>
    <div class="title">
      <img src="assets/mase-logo.png" alt="Ministero dell'Ambiente e della Sicurezza Energetica">
      <h1 id="title">Dossier</h1>
      <p>Elaborazione dati · DG AEIF GLU</p>
    </div>
    <div class="actions">
      <a class="btn primary" id="openPdf" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        Apri PDF
      </a>
      <a class="btn" id="downloadPdf" href="#" download>
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Scarica
      </a>
    </div>
  </header>
  <section class="viewer">
    <iframe id="pdfFrame" title="Dossier PDF"></iframe>
    <div class="fallback" id="fallback">
      PDF non selezionato. Torna alla home e scegli un dossier.
    </div>
  </section>
</main>
<script>
  const dossiers = {
    mercati: {
      title: "Dossier mercati elettrici",
      file: "dossiers/dossier_mercati_elettrici.pdf"
    },
    ets: {
      title: "Dossier ETS",
      file: "dossiers/dossier_approfondimento_ets.pdf"
    }
  };
  const params = new URLSearchParams(window.location.search);
  const key = params.get("dossier") || "mercati";
  const dossier = dossiers[key];
  const frame = document.getElementById("pdfFrame");
  const fallback = document.getElementById("fallback");
  const backBtn = document.getElementById("backBtn");

  if (dossier) {
    document.title = `${dossier.title} · Dashboard AEIF`;
    document.getElementById("title").textContent = dossier.title;
    document.getElementById("openPdf").href = dossier.file;
    document.getElementById("downloadPdf").href = dossier.file;
    frame.src = dossier.file;
  } else {
    frame.style.display = "none";
    fallback.style.display = "block";
  }

  backBtn.addEventListener("click", function () {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "index.html";
    }
  });
</script>
<script src="assets/site-chrome.js?v=20260825-pwa"></script>
</body>
</html>
